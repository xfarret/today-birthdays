name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin zip

      - name: Prepare extension packages
        run: |
          UUID="today-birthdays@xfarret"
          STAGE_DIR="/tmp/stage/${UUID}"
          mkdir -p "${STAGE_DIR}"

          # Copie uniquement les fichiers de l'extension (adaptez la liste si besoin)
          cp -r extension.js prefs.js metadata.json stylesheet.css schemas "${STAGE_DIR}/"

          # 1. ZIP pour extensions.gnome.org (sans gschemas.compiled)
          (
            cd /tmp/stage
            zip -r "${GITHUB_WORKSPACE}/${UUID}-ego.zip" "${UUID}" -x "*/gschemas.compiled"
          )

          # 2. Compilation du schéma et ZIP pour GitHub Releases (avec gschemas.compiled)
          glib-compile-schemas "${STAGE_DIR}/schemas/"
          (
            cd /tmp/stage
            zip -r "${GITHUB_WORKSPACE}/${UUID}.zip" "${UUID}"
          )

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            today-birthdays@xfarret.zip
            today-birthdays@xfarret-ego.zip
